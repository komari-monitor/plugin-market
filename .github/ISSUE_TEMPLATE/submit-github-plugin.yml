name: 提交在 GitHub 中开源的插件
description: Submit an open-source plugin hosted on GitHub.
title: "[Plugin] "
labels:
  - plugin-submission
  - github-plugin
body:
  - type: markdown
    attributes:
      value: |
        ## 提交在 GitHub 中开源的插件

        Submit an open-source plugin hosted in a public GitHub repository.

  - type: input
    id: repository
    attributes:
      label: GitHub 仓库地址 / GitHub repository URL
      description: "示例 / Example: https://github.com/owner/repository"
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 插件分类 / Plugin category
      description: 按主要用途选择一个分类；没有合适分类时请选择“未分类”。通知渠道负责发送消息，监控与告警负责检测及触发告警。 / Choose one primary category, or Uncategorized if none fits. Notification channels deliver messages; monitoring plugins detect conditions and trigger alerts.
      options:
        - 通知渠道 / Notifications
        - 监控与告警 / Monitoring and alerts
        - 网络与域名 / Network and domains
        - 登录与安全 / Login and security
        - 数据与集成 / Data and integrations
        - 系统与工具 / System and utilities
        - 未分类 / Uncategorized
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 我已确保 / I confirm
      options:
        - label: 仓库必须公开，且最新 Release 中必须提供可下载的插件包。 / The repository must be public and provide a downloadable plugin package in its latest Release.
          required: true

  - type: markdown
    attributes:
      value: |
        市场会每六小时检查本仓库的最新 GitHub Release；验证通过的插件包发生变化时，会自动发起更新 PR。

        The market checks the latest GitHub Release every six hours and automatically opens an update PR when a verified package changes.
