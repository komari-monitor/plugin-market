name: Update Plugin Releases

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-market-catalog-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-plugin-releases.mjs --pr-body="$RUNNER_TEMP/plugin-release-pr-body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-catalog-order.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/update-plugin-releases
          delete-branch: true
          commit-message: "chore: update plugin releases"
          title: "chore: update plugin releases"
          body-path: ${{ runner.temp }}/plugin-release-pr-body.md
