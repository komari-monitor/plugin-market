name: Update Plugin Releases

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-market-catalog-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-plugin-releases.mjs --pr-body="$RUNNER_TEMP/plugin-release-pr-body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-catalog-order.mjs
      - id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/update-plugin-releases
          delete-branch: true
          commit-message: "chore: update plugin releases"
          title: "chore: update plugin releases"
          body-path: ${{ runner.temp }}/plugin-release-pr-body.md
      - name: Queue AI package review
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "review-plugin-packages.yml",
              ref: context.payload.repository.default_branch,
              inputs: { pull_request_number: process.env.PULL_REQUEST_NUMBER },
            });
